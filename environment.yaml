name: har
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - matplotlib
  - seaborn
  - jupyterlab
  - ipykernel
  - ipython
  - pytz
  - pyyaml
  - requests
  - setuptools
  - wheel
  - typing_extensions
  - packaging
  - tqdm
  - rich
  - pillow
  - psutil
  - yaml
  - sqlite
  - zlib
  - xz
  - openssl
  - ca-certificates
  - tk
  - pip:
      # PyTorch (Metal/MPS acceleration is built into macOS wheels)
      - torch==2.6.0
      - torchvision==0.21.0
      - torchaudio==2.6.0
      # extras often used in your projects
      - resampy==0.4.3
      - hickle==5.0.3
      - networkx==3.2.1
      - sympy==1.13.1
      - pandas==2.2.3
      - scipy==1.13.1
      - scikit-learn==1.6.1
      - matplotlib==3.9.4
      - seaborn==0.13.2
